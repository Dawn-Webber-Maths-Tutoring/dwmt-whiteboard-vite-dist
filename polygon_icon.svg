<svg width="48" height="48" viewBox="-10 0 51 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" />
      <feOffset dx="0" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(-14 0)">
    <!-- Pentagon polygon shape -->
    <path
      d="M 24 8 L 38 18 L 32 34 L 16 34 L 10 18 Z"
      fill="none"
      stroke="#1a2902"
      stroke-width="2.5"
      stroke-linejoin="round"
      filter="url(#shadow)"
    />

    <!-- Vertex dots to indicate clickable points -->
    <circle cx="24" cy="8" r="2.5" fill="#6b9023" stroke="#1a2902" stroke-width="1" />
    <circle cx="38" cy="18" r="2.5" fill="#6b9023" stroke="#1a2902" stroke-width="1" />
    <circle cx="32" cy="34" r="2.5" fill="#6b9023" stroke="#1a2902" stroke-width="1" />
    <circle cx="16" cy="34" r="2.5" fill="#6b9023" stroke="#1a2902" stroke-width="1" />
    <circle cx="10" cy="18" r="2.5" fill="#6b9023" stroke="#1a2902" stroke-width="1" />
  </g>
</svg>
